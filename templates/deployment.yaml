{{- range $name, $app := .Values.apps }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-prod
  labels:
    app: {{ $name }}
    tier: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ $name }}
      tier: prod
  template:
    metadata:
      labels:
        app: {{ $name }}
        tier: prod
    spec:
      containers:
        - name: {{ $name }}
          image: nexus-oci-{{ $.Values.guid }}.{{ $.Values.domain }}/oci/{{ $name }}:{{ $app.imageTag }}
          ports:
            - containerPort: {{ $app.port }}
          readinessProbe:
            tcpSocket:
              port: {{ $app.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
{{- end }}
